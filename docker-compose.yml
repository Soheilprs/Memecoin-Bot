services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memecoin
      POSTGRES_PASSWORD: memecoin
      POSTGRES_DB: memecoin
    ports:
      # Host 5432–5434 are often taken by other local Postgres containers.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memecoin"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    image: rust:1.85
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgres://memecoin:memecoin@postgres:5432/memecoin
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-}
      SOLANA_GRPC_URL: ${SOLANA_GRPC_URL:-}
      SOLANA_GRPC_TOKEN: ${SOLANA_GRPC_TOKEN:-}
      BASE_WS_URL: ${BASE_WS_URL:-}
      BASE_HTTP_URL: ${BASE_HTTP_URL:-}
      ROBINHOOD_WS_URL: ${ROBINHOOD_WS_URL:-}
      ROBINHOOD_HTTP_URL: ${ROBINHOOD_HTTP_URL:-}
      METRICS_ADDR: 0.0.0.0:9100
      RUST_LOG: info
    command: cargo run -p memecoin-engine -- collect all
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["collect"]

  pons-exp002:
    image: rust:1.85
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://memecoin:memecoin@postgres:5432/memecoin
      RUST_LOG: info
    command: cargo run -p memecoin-engine -- research pons-exp001 start --experiment PONS_PROSPECTIVE_EXP002
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["exp002"]
