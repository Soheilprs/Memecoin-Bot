[package]
name = "memecoin-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "memecoin_engine"
path = "src/lib.rs"

[[bin]]
name = "memecoin-engine"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "1.1", features = ["serde"] }
alloy-sol-types = "1.1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
rand = "0.8"
url = "2"
bytes = "1"
yellowstone-grpc-client = "13.4.0"
yellowstone-grpc-proto = "12.6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tempfile = "3"
